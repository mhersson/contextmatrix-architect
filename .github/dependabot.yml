# Dependabot config for contextmatrix-architect.
# Canonical copy: contextmatrix-agent/.github/dependabot.yml - sync by
# full-file copy plus repo-name swap (with the docker block pointed at the
# repo root, where the Dockerfile lives), keeping the architect-only go-git
# ignore in the gomod block.
# Tracks three ecosystems weekly:
#   - gomod          : Go module dependencies at the repo root.
#   - docker         : Dockerfile base images.
#   - github-actions : pinned action versions in .github/workflows/*.
#
# Paired with CI (.github/workflows/ci.yaml). Dependabot bump PRs must pass the
# same gates as any other PR. Minor/patch bumps are grouped to cut PR noise.
# Every contextmatrix repo runs Dependabot at the same day and time, so
# bumps to shared base images and modules land the same night.

version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held at 5.19.2 to match contextmatrix: 5.19.3 writes an empty
      # extensions.objectformat when it rewrites a format-version-1 config,
      # which shell git then rejects. No architect path hits it today (go-git
      # creates every mirror at format version 0 and git runs only in tests).
      - dependency-name: github.com/go-git/go-git/v5
        versions: [">5.19.2"]
    labels:
      - dependencies
      - go

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
