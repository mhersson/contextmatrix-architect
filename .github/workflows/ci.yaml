# CI pipeline for contextmatrix-architect.
#
# Gates every pull_request on the full quality bar. Pushes to main skip the
# checks (already validated on the PR) - branch protection requires the check
# jobs to pass before merge - and run only the image job, which builds on the
# self-hosted runner and pushes <short sha> and latest to the registry in the
# REGISTRY repository variable. A workflow_dispatch run builds after the
# checks and pushes <branch>-<short sha> only.
#
# GitHub Actions are pinned to exact release tags; Dependabot
# (.github/dependabot.yml) keeps them current.

name: ci

on:
  push:
    branches: [main]
    # Every image is deployed and a restart re-runs an open blueprint stage,
    # so a docs-only merge builds nothing. Pull requests stay unfiltered.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "config.yaml.example"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: make test

      - name: go test -race
        run: make test-race

  lint:
    name: lint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint at the version the Makefile pins, so CI and a
      # local `make lint` use the same release.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          VERSION=$(grep '^GOLANGCI_LINT_VERSION' Makefile | head -1 | awk '{print $NF}')
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${VERSION}"

      - name: golangci-lint
        run: make lint

  build:
    name: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: make build

  govulncheck:
    name: govulncheck
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Fail only on findings that have an upstream fix (fixed_version set);
      # transitive findings with no available fix are printed but do not block.
      - name: Run govulncheck (fail only on fixable findings)
        run: |
          set -euo pipefail
          govulncheck -format=json ./... > /tmp/vuln.json 2>&1 || true

          FIXABLE=$(jq -s '[.[] | select(.finding != null
                                          and .finding.fixed_version != null
                                          and .finding.fixed_version != "")] | length' /tmp/vuln.json)

          echo "fixable findings: ${FIXABLE}"

          govulncheck ./... || true

          if [ "${FIXABLE:-0}" -gt 0 ]; then
            echo "::error::Fixable vulnerabilities detected. See output above."
            exit 1
          fi

          echo "No fixable vulnerabilities. Remaining findings have no upstream fix available."

  hadolint:
    name: hadolint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  image-scan:
    name: image-scan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build image
        run: make docker

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: contextmatrix-architect:dev
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          # Only run the vulnerability scanner, as every contextmatrix image
          # scan does.
          scanners: vuln

  # Publishes only from a push or a dispatch, never from a pull request. A
  # fork's pull request runs its own copy of this file, so keeping forks off
  # the self-hosted runner is the repo's fork-PR approval policy, not this
  # guard. On push the checks are skipped, which this guard lets through.
  image:
    name: image
    runs-on: self-hosted
    needs: [test, lint, build, govulncheck, hadolint, image-scan]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      # The Dockerfile reads TARGETARCH, which only BuildKit sets.
      DOCKER_BUILDKIT: "1"
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set image tag
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::repository variable REGISTRY is not set"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9._-]|-|g' | cut -c1-50)
            echo "IMAGE_TAG=${BRANCH_SLUG}-${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "PUSH_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: |
          tags=(-t "${REGISTRY}/contextmatrix-architect:${IMAGE_TAG}")
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags+=(-t "${REGISTRY}/contextmatrix-architect:latest")
          fi
          docker build "${tags[@]}" .

      - name: Push image
        run: |
          docker push "${REGISTRY}/contextmatrix-architect:${IMAGE_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            docker push "${REGISTRY}/contextmatrix-architect:latest"
          fi

      - name: Clean up
        if: always()
        run: docker image prune -f
