# Nightly race check for contextmatrix-architect.
#
# The full -race suite takes about 7 minutes, so it runs once a night instead
# of on every pull request. Scheduled after contextmatrix's 02:00 run.

name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: make test-race
