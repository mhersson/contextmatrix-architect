name: default
version: "0.8"
stages:
  - id: intake
    persona: product_owner
    produces: need
    checks: [assumptions]
    policy: human
    max_questions: 3
  - id: slicing
    persona: product_owner
    produces: slices
    consumes: [intake]
    checks: [slices]
    policy: human
    gate: true
    fold: {field: slices, max: 1}
    reviewer: {persona: system_designer, threshold: 4}
  - id: solution_design
    persona: system_designer
    produces: design
    consumes: [intake, slicing]
    tools: [code]
    checks: [assumptions, decisions]
    policy: human
    gate: true
    max_questions: 5
    reviewer: {persona: senior_developer, threshold: 4}
  - id: grounding
    persona: senior_developer
    produces: grounding
    consumes: [intake, slicing, solution_design]
    tools: [code, cm]
  - id: decomposition
    persona: senior_developer
    produces: cards
    consumes: [intake, slicing, solution_design, grounding]
    tools: [code]
    checks: [cards]
  - id: readiness
    persona: reviewer
    produces: readiness
    consumes: [intake, slicing, solution_design, grounding, decomposition]
    tools: [code, cm]
    loops_to: decomposition
    max_rounds: 3
