name: default
version: "0.33"
stages:
  - id: intake
    persona: product_owner
    tools: [code, research, knowledge]
    checks: [assumptions, outcomes, screen]
    policy: human
    gate: true
    gate_policy: auto
    max_questions: 3
    reviewer: {persona: system_designer, threshold: 4, tools: [code, research, knowledge]}
  - id: mockup
    persona: designer
    consumes: [intake]
    tools: [code]
    checks: [mockup]
    policy: human
  - id: slicing
    persona: product_owner
    consumes: [intake, mockup]
    tools: [code, research, knowledge]
    checks: [slices]
    policy: human
    gate: true
    fold: {field: slices, max: 1}
    reviewer: {persona: system_designer, threshold: 4, tools: [code, research, knowledge]}
  - id: shared_decisions
    persona: system_designer
    consumes: [intake, mockup, slicing]
    tools: [code, research, knowledge]
    checks: [assumptions, decisions, outcomes]
    policy: human
    gate: true
    shared: true
    max_questions: 5
    reviewer: {persona: senior_developer, threshold: 4, tools: [code, research, knowledge]}
  - id: solution_design
    persona: system_designer
    consumes: [intake, mockup, slicing, shared_decisions]
    tools: [code, research, knowledge]
    checks: [assumptions, decisions, outcomes]
    policy: human
    gate: true
    per_slice: true
    earlier_slices: [solution_design, acceptance, decomposition]
    max_questions: 5
    reviewer: {persona: senior_developer, threshold: 4, tools: [code, research, knowledge]}
  - id: grounding
    persona: senior_developer
    consumes: [intake, slicing, shared_decisions, solution_design]
    tools: [code, cm]
    per_slice: true
    earlier_slices: [solution_design, acceptance, decomposition]
  - id: acceptance
    persona: senior_developer
    consumes: [intake, slicing, shared_decisions, solution_design, grounding]
    tools: [knowledge]
    checks: [criteria]
    per_slice: true
    earlier_slices: [solution_design, acceptance, decomposition]
    policy: auto
    gate: true
    reviewer: {persona: tester, threshold: 4, tools: [code, research, knowledge]}
  - id: decomposition
    persona: senior_developer
    consumes: [intake, mockup, slicing, shared_decisions, solution_design, grounding, acceptance]
    tools: [code, knowledge]
    checks: [cards]
    per_slice: true
    earlier_slices: [solution_design, acceptance, decomposition]
  - id: readiness
    persona: reviewer
    consumes: [intake, mockup, slicing, shared_decisions, solution_design, grounding, acceptance, decomposition]
    tools: [code, cm, knowledge]
    checks: [readiness]
    loops_to: decomposition
    max_rounds: 3
