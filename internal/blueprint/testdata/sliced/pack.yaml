name: sliced
version: "1"
stages:
  - id: intake
    persona: product_owner
    policy: human
  - id: slicing
    persona: product_owner
    consumes: [intake]
    checks: [slices]
    policy: human
    gate: true
    fold: {field: slices, max: 1}
    reviewer: {persona: system_designer, threshold: 4}
  - id: shared_decisions
    persona: system_designer
    consumes: [intake, slicing]
    policy: human
    gate: true
    shared: true
    checks: [assumptions, decisions]
    reviewer: {persona: senior_developer, threshold: 4}
  - id: solution_design
    persona: system_designer
    consumes: [intake, slicing, shared_decisions]
    policy: human
    gate: true
    reviewer: {persona: senior_developer, threshold: 4}
    checks: [assumptions, decisions]
    per_slice: true
    earlier_slices: [solution_design]
  - id: grounding
    persona: senior_developer
    consumes: [intake, slicing, shared_decisions, solution_design]
    per_slice: true
    earlier_slices: [solution_design]
  - id: acceptance
    persona: senior_developer
    consumes: [intake, slicing, shared_decisions, solution_design, grounding]
    checks: [criteria]
    policy: auto
    gate: true
    reviewer: {persona: senior_developer, threshold: 4}
    per_slice: true
    earlier_slices: [solution_design, acceptance]
  - id: decomposition
    persona: senior_developer
    consumes: [intake, slicing, shared_decisions, solution_design, grounding, acceptance]
    tools: [code]
    checks: [cards]
    per_slice: true
    earlier_slices: [solution_design, acceptance, decomposition]
  - id: readiness
    persona: reviewer
    consumes: [intake, slicing, shared_decisions, solution_design, grounding, acceptance, decomposition]
    loops_to: decomposition
    max_rounds: 3
    checks: [readiness]
