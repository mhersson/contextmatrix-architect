name: dialog
version: "1"
stages:
  - id: intake
    persona: product_owner
    checks: [assumptions]
    policy: human
  - id: slicing
    persona: product_owner
    consumes: [intake]
    checks: [slices]
    policy: human
    gate: true
    fold: {field: slices, max: 1}
    reviewer: {persona: system_designer, threshold: 4}
  - id: solution_design
    persona: system_designer
    consumes: [intake, slicing]
    tools: [code]
    checks: [assumptions, decisions]
    policy: human
    gate: true
    max_questions: 5
    reviewer: {persona: senior_developer, threshold: 4}
  - id: grounding
    persona: senior_developer
    consumes: [intake, slicing, solution_design]
    tools: [code, cm]
  - id: acceptance
    persona: senior_developer
    consumes: [intake, slicing, solution_design, grounding]
    checks: [criteria]
    policy: auto
    gate: true
    reviewer: {persona: senior_developer, threshold: 4}
  - id: decomposition
    persona: senior_developer
    consumes: [intake, slicing, solution_design, grounding, acceptance]
    tools: [code]
    checks: [cards]
  - id: readiness
    persona: reviewer
    consumes: [intake, slicing, solution_design, grounding, acceptance, decomposition]
    tools: [code, cm]
    loops_to: decomposition
    max_rounds: 3
